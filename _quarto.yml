project:
  type: website
  resources:
    - assets/*
    - assets/images/*
    - assets/pdfs/*
  preview:
    port: 8800
    browser: false
  output-dir: docs
  render:
    - index.qmd
    - vorbereitung/index.qmd
    - workshop/**/*.qmd
    - 01-lernen-verstehen/**/*.qmd
    - 02-ki-und-lernen/**/*.qmd
    - 03-praxis/**/*.qmd
    - resources/**/*.qmd
    - slides/**/*.qmd

website:
  title: "KI in der Lehre: Intermediate"
  site-url: https://virtuelleakademie.github.io/ki-lehre-intermediate/
  # repo-url: https://github.com/virtuelleakademie/cas-hochschuldidaktik/
  # repo-actions: [edit, issue]
  favicon: /assets/robot.png
  open-graph: true
  search:
    location: navbar
    type: overlay

  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true


  navbar:
    background: light
    left:
      - icon: card-list
        href: workshop/index.qmd
        text: Workshop
      - icon: person-gear
        href: 01-lernen-verstehen/index.qmd
        text: "Lernen verstehen"
      - icon: motherboard
        href: 02-ki-und-lernen/index.qmd
        text: "KI & Lernen"
      - icon: marker-tip
        href: 03-praxis/index.qmd
        text: "Praxis"

    right:
      - icon: book
        text: "Ressourcen"
        menu:
          - text: "Die 8 Make it Stick Strategien"
            file: resources/handout-make-it-stick/index.qmd
          - text: "Agent-Template (Analyse & Anpassung)"
            file: 03-praxis/agent-template/index.qmd
          - text: "Agent-Beispiele (Illustrationen)"
            file: resources/agent-beispiele/index.qmd
          - text: "Produktive Anstrengung durch Design"
            file: resources/produktive-anstrengung/index.qmd
          - text: "---"
          - text: "Begleitdokument: KI Weiterbildung"
            file: assets/pdfs/Begleitdokument.pdf
          - text: "Begleitdokument: KI Policy (PDF)"
            file: assets/pdfs/KI-Policy_BFH_FHL7Mai25_verabschiedet-1.pdf
          - text: "Begleitdokument: Orientierungshilfe"
            file: resources/resources.qmd
          - text: "Begleitdokument: Orientierungshilfe (PDF)"
            file: assets/pdfs/Orientierungshilfe.pdf

    tools:
      - icon: mortarboard-fill
        text: "BFH Weiterbildung: KI in der Lehre"
        href: https://virtuelleakademie.github.io/de/teaching/bfh-weiterbildung/
        target: _blan
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/

      # - icon: github
      #   menu:
      #     - text: Source code
      #       url:  https://github.com/virtuelleakademie/ki-lehre-intermediate/
      #     - text: Report an issue
      #       url:  https://github.com/virtuelleakademie/ki-lehre-intermediate

  sidebar:
    - title: "Workshop"
      style: "docked"
      search: true
      background: light
      contents:
        - vorbereitung/index.qmd
        - workshop/index.qmd
        - workshop/einstieg/index.qmd
        # - 01-lernen-verstehen/index.qmd
        # - 02-ki-und-lernen/index.qmd
        # - 03-praxis/index.qmd
        - workshop/diskussion/index.qmd

    - title: "Teil 1: Lernen verstehen"
      style: "docked"
      search: true
      background: light
      contents:
        - 01-lernen-verstehen/index.qmd
        - 01-lernen-verstehen/arbeitsgedaechtnis/index.qmd
        - 01-lernen-verstehen/gedaechtnis-und-lernen/index.qmd
        - 01-lernen-verstehen/kompetenz-erwerben/index.qmd

    - title: "Teil 2: KI & Lernen"
      style: "docked"
      search: true
      background: light
      contents:
        - 02-ki-und-lernen/index.qmd
        - 02-ki-und-lernen/5-leitfragen/index.qmd

    - title: "Teil 3: Praxis"
      style: "docked"
      search: true
      background: light
      contents:
        - 03-praxis/index.qmd
        - 03-praxis/fallstudien/index.qmd
        - 03-praxis/agent-template/index.qmd

    - title: "Ressourcen"
      style: "docked"
      search: true
      background: light
      contents:
        - resources/handout-make-it-stick/index.qmd
        - resources/agent-beispiele/index.qmd
        - resources/produktive-anstrengung/index.qmd

page-footer:
    right:
    - icon: github
      href: https://github.com/virtuelleakademie/ki-lehre-intermediate/

lang: de

format:
  html:
    theme:
      - simplex
      - styles/custom.scss
    css: styles/styles.css
    code-copy: true
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    linkcolor: "#9A4665"

comments:
  hypothesis:
    theme: clean
  # utterances:
    # repo: virtuelleakademie/ki-lehre-intermediate

execute:
  cache: true
  freeze: auto
  warning: false

editor:
  render-on-save: true

revealjs-plugins:
  - attribution
filters:
  - timer
  - custom-callout
  # - linkate

custom-callout:
  # Action callouts - what participants DO (Burgundy)
  active-processing:
    title: "Aktive Verarbeitung"
    icon-symbol: "fa-pen-to-square"
    appearance: default
    collapse: false
    color: "#9A4665"

  agent-potential:
    title: "Agent-Potential"
    icon-symbol: "fa-robot"
    appearance: default
    collapse: false
    color: "#9A4665"

  individual:
    title: "Einzelarbeit"
    icon-symbol: "fa-user"
    appearance: default
    color: "#9A4665"
    collapse: false

  pair:
    title: "Partnerarbeit"
    icon-symbol: "fa-user-group"
    appearance: default
    color: "#9A4665"
    collapse: false

  group:
    title: "Gruppenarbeit"
    icon-symbol: "fa-users"
    appearance: default
    color: "#9A4665"
    collapse: false

  # Insight callouts - reflection and understanding (Gold)
  reflect:
    title: "Reflexion"
    icon-symbol: "fa-lightbulb"
    appearance: default
    color: "#D4A03E"
    collapse: false

  pro-tip:
    title: "Tipp"
    icon-symbol: "fa-wand-magic-sparkles"
    appearance: default
    color: "#D4A03E"
    collapse: true

  nachlesen:
    title: "Zum Nachlesen"
    icon-symbol: "fa-book-open"
    appearance: default
    color: "#D4A03E"
    collapse: true

  # Neutral callouts (Dark grey)
  facilitator:
    title: "Moderationshinweis"
    icon-symbol: "fa-clipboard-list"
    appearance: default
    color: "#333333"
    collapse: true
